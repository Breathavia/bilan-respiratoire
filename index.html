<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bilan Respiratoire Breathavia</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --charcoal:#2B2B2B;
  --gold:#C9A84C;
  --gold-light:#F0DFA8;
  --cream:#FAF6EE;
  --dusty-blue:#BFD4D8;
  --dusty-blue-light:#E6F0F2;
  --mid:#6B6B6B;
  --border:#D9CFC0;
  --white:#FFFFFF;
  --section-bg:#F4EFE6;
}
body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--charcoal);font-size:15px;line-height:1.6;min-height:100vh;}
.page-wrap{max-width:720px;margin:0 auto;padding:0 0 80px;}
header{background:var(--charcoal);padding:40px 40px 36px;text-align:center;position:relative;}
.lang-btn{position:absolute;top:14px;right:16px;background:transparent;border:1px solid var(--gold);color:var(--gold);border-radius:20px;padding:5px 14px;font-size:12px;font-family:'DM Sans',sans-serif;letter-spacing:.08em;cursor:pointer;}
.lang-btn:hover{background:var(--gold);color:var(--charcoal);}
.logo-mark{width:48px;height:48px;margin:0 auto 16px;opacity:.9;}
header h1{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:500;color:var(--gold);letter-spacing:.04em;margin-bottom:4px;}
header .tagline{font-size:12px;color:var(--dusty-blue);letter-spacing:.12em;text-transform:uppercase;margin-bottom:20px;}
.intro-box{background:rgba(191,212,216,.12);border:1px solid rgba(191,212,216,.3);border-radius:6px;padding:16px 20px;text-align:left;color:#d6cfc5;font-size:13.5px;line-height:1.65;}
.intro-box strong{color:var(--gold-light);}
.section{background:var(--white);border-bottom:1px solid var(--border);padding:28px 40px;}
.section-header{display:flex;align-items:center;gap:12px;margin-bottom:20px;padding-bottom:12px;border-bottom:1px solid var(--border);}
.section-num{width:26px;height:26px;border-radius:50%;background:var(--gold);color:var(--white);font-size:12px;font-weight:500;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.section-title{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:600;color:var(--charcoal);}
.section-subtitle{font-size:12px;color:var(--mid);margin-top:1px;}
.field{margin-bottom:18px;}
.field label{display:block;font-size:13.5px;font-weight:500;color:var(--charcoal);margin-bottom:6px;}
.field label em{display:block;font-style:italic;font-weight:400;font-size:12px;color:var(--mid);margin-top:1px;}
.field input[type=text],.field input[type=email],.field input[type=number],.field textarea{width:100%;padding:10px 13px;border:1px solid var(--border);border-radius:5px;font-family:'DM Sans',sans-serif;font-size:16px;color:var(--charcoal);background:var(--cream);outline:none;transition:border-color .18s;}
.field input:focus,.field textarea:focus{border-color:var(--gold);}
.radio-group{display:flex;flex-wrap:wrap;gap:8px;}
.radio-group label{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:400;cursor:pointer;margin:0;padding:7px 13px;border:1px solid var(--border);border-radius:20px;background:var(--cream);transition:all .15s;}
.radio-group label:hover{border-color:var(--gold);background:var(--gold-light);}
.radio-group input[type=radio],.radio-group input[type=checkbox]{accent-color:var(--gold);width:14px;height:14px;margin:0;flex-shrink:0;}
.radio-group label:has(input:checked){border-color:var(--gold);background:var(--gold-light);}
.radio-group.stack{flex-direction:column;gap:6px;}
.radio-group.stack label{border-radius:8px;}
.sev-table{width:100%;border-collapse:collapse;font-size:13px;}
.sev-table th{font-weight:500;font-size:11px;color:var(--mid);padding:7px 8px;text-align:center;border-bottom:1px solid var(--border);background:var(--section-bg);}
.sev-table th:first-child{text-align:left;}
.sev-table td{padding:8px 8px;border-bottom:1px solid #ede8df;vertical-align:middle;font-size:13px;}
.sev-table td:not(:first-child){text-align:center;}
.sev-table tr:last-child td{border-bottom:none;}
.sev-table input[type=radio]{accent-color:var(--gold);width:15px;height:15px;cursor:pointer;}
.cp-box{background:var(--dusty-blue-light);border:1px solid var(--dusty-blue);border-radius:8px;padding:18px 22px;}
.cp-box p{font-size:13px;color:var(--mid);line-height:1.6;margin-bottom:10px;}
.cp-protocol{background:var(--white);border-radius:5px;padding:12px 16px;font-size:12.5px;color:var(--charcoal);line-height:1.7;border:1px solid var(--border);margin-bottom:12px;}
.cp-protocol strong{color:var(--gold);}
.cp-timer{background:var(--cream);border:1px solid var(--border);border-radius:8px;padding:16px;margin:14px 0;text-align:center;}
.cp-timer-display{font-size:44px;font-weight:500;letter-spacing:.02em;color:var(--charcoal);font-variant-numeric:tabular-nums;margin:4px 0 12px;}
.cp-timer-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
.cp-timer-btns button{padding:12px 22px;border-radius:6px;border:1px solid var(--gold);background:var(--gold);color:#fff;font-size:15px;font-weight:500;font-family:'DM Sans',sans-serif;cursor:pointer;min-width:120px;}
.cp-timer-btns button.sec{background:transparent;color:var(--charcoal);border-color:var(--border);}
.cp-timer-btns button:disabled{opacity:.4;cursor:default;}
.cp-timer-note{font-size:12px;color:var(--mid);margin-top:10px;}
.cp-result{margin-top:10px;font-size:14px;font-weight:500;color:var(--charcoal);min-height:22px;}
.cp-scale{margin-top:12px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
.cp-zone{border-radius:5px;padding:7px 8px;text-align:center;font-size:11px;line-height:1.4;opacity:.75;border:2px solid transparent;}
.cp-zone.active{opacity:1;border-color:currentColor;}
.cp-zone strong{display:block;font-size:14px;margin-bottom:2px;}
.z-red{background:#FDECEA;color:#8B2E2E;}
.z-orange{background:#FEF3E2;color:#7A4A0A;}
.z-yellow{background:#FEFCE8;color:#6B5500;}
.z-green{background:#EDFBF3;color:#1A5C38;}
.sebq-item{background:var(--section-bg);border-radius:6px;padding:12px 14px;margin-bottom:8px;}
.req{color:var(--gold);margin-left:2px;}
.hint{font-size:12px;color:var(--mid);margin-top:4px;}
.ph{background:#FFF3B0;color:#6B5500;border-radius:3px;padding:0 3px;font-weight:500;}
.sub-q{margin-bottom:18px;}
.sub-q>.q-label{display:block;font-size:13.5px;font-weight:500;margin-bottom:6px;}
.num-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
.num-row label{font-size:13.5px;font-weight:500;flex:1;min-width:200px;}
.num-row input{width:80px;padding:9px 10px;border:1px solid var(--border);border-radius:5px;font-size:16px;text-align:center;background:var(--cream);font-family:'DM Sans',sans-serif;outline:none;}
.num-row input:focus{border-color:var(--gold);}
.err{color:#B3261E;font-size:13px;margin-top:10px;text-align:center;min-height:18px;}
.submit-section{background:var(--charcoal);padding:32px 40px;text-align:center;}
.btn-submit{background:var(--gold);color:var(--charcoal);border:none;border-radius:4px;padding:14px 48px;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:500;letter-spacing:.06em;cursor:pointer;transition:opacity .18s;}
.btn-submit:hover{opacity:.88;}
.btn-submit:disabled{opacity:.6;cursor:not-allowed;}
.submit-note{color:var(--dusty-blue);font-size:12px;margin-top:10px;}
footer{background:#222;padding:20px 40px;text-align:center;}
footer p{font-size:10px;color:#7a7060;line-height:1.8;}
/* Résultats */
#results{display:none;}
.res-hero{background:var(--charcoal);padding:36px 40px;text-align:center;}
.res-hero h2{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:500;color:var(--gold);margin-bottom:6px;}
.res-hero p{color:#d6cfc5;font-size:13.5px;}
.res-sec{background:var(--white);border-bottom:1px solid var(--border);padding:26px 40px;}
.res-sec h3{font-family:'Cormorant Garamond',serif;font-size:19px;font-weight:600;color:var(--gold);margin-bottom:12px;}
.pillar{margin-bottom:16px;}
.pillar-top{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;margin-bottom:5px;}
.pillar-name{font-weight:500;}
.pillar-level{font-size:13px;font-weight:500;}
.bar-bg{background:#ECE6D8;border-radius:8px;height:14px;overflow:hidden;}
.bar-fill{height:100%;border-radius:8px;}
.lv0{color:#B4541A;}.bf0{background:#E08A4B;}
.lv1{color:#8A6D00;}.bf1{background:#D9B54A;}
.lv2{color:#1A5C38;}.bf2{background:#4FA877;}
.priority-card{background:var(--section-bg);border-left:4px solid var(--gold);border-radius:4px;padding:14px 18px;font-size:14px;line-height:1.7;}
.priority-card strong{color:var(--charcoal);}
.cross{margin-top:14px;font-size:14px;line-height:1.7;}
.icr-big{font-size:34px;font-weight:500;}
.ex-list{margin:8px 0 0 20px;font-size:14px;line-height:1.75;}
.ex-title{font-weight:500;font-size:14px;}
.warn{background:#FEF3E2;border:1px solid #F0D2A0;color:#7A4A0A;border-radius:6px;padding:12px 16px;font-size:13px;line-height:1.6;margin-bottom:14px;}
details.det{border:1px solid var(--border);border-radius:6px;padding:10px 14px;background:var(--cream);}
details.det summary{cursor:pointer;font-weight:500;font-size:14px;}
details.det table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px;}
details.det td{padding:7px 4px;border-bottom:1px solid #ede8df;vertical-align:top;}
details.det td:last-child{text-align:right;font-weight:500;white-space:nowrap;padding-left:10px;}
.limits{font-size:12.5px;color:var(--mid);line-height:1.7;}

body{padding-top:52px;}
#progress-bar{position:fixed;top:0;left:0;right:0;z-index:60;background:var(--charcoal);padding:2px 12px;min-height:48px;display:flex;gap:10px;align-items:center;box-shadow:0 1px 4px rgba(0,0,0,.25);}
#progress-bar.hidden{display:none;}
.pg-seg{flex:1;min-width:0;}
.pg-lbl{display:block;font-size:12px;color:var(--dusty-blue);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px;}
.pg-track{height:4px;background:rgba(255,255,255,.18);border-radius:3px;overflow:hidden;}
.pg-fill{height:100%;width:0;background:var(--gold);transition:width .25s;}
.pg-seg.done .pg-lbl{color:var(--gold);}
.pg-reset{background:transparent;border:none;color:var(--dusty-blue);font-size:11px;text-decoration:underline;cursor:pointer;font-family:'DM Sans',sans-serif;padding:0 2px;white-space:nowrap;}
.btn-link{background:transparent;border:none;color:var(--dusty-blue);font-size:12px;text-decoration:underline;cursor:pointer;font-family:'DM Sans',sans-serif;margin-top:14px;}
.btn-secondary{background:var(--gold);color:var(--charcoal);border:none;border-radius:4px;padding:11px 32px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;cursor:pointer;}
.btn-secondary:hover{opacity:.88;}
.contact-actions{text-align:center;margin-top:6px;}
.contact-err{color:#B3261E;font-size:13px;margin-top:8px;min-height:18px;}
.num{display:none;}
.sev-table td.m-ends{display:none;}
.cp-warn{color:#B4541A;font-size:14px;margin-top:6px;min-height:0;}
.alt-lang{display:block;font-size:11.5px;font-style:italic;color:var(--mid);font-weight:400;margin-top:2px;}
.consent-row{display:flex;align-items:flex-start;gap:10px;font-weight:400;cursor:pointer;margin-bottom:12px;}
.consent-row input{margin-top:3px;accent-color:var(--gold);width:16px;height:16px;flex-shrink:0;}
.consent-row span.txt{font-size:13.5px;}
.pol{color:var(--gold);text-decoration:underline;}
@media(max-width:580px){
  .section,.res-sec{padding:20px 18px;}
  header{padding:44px 20px 24px;}
  .res-hero{padding:28px 18px;}
  .cp-scale{grid-template-columns:1fr 1fr;}
}

/* Boutons: zone tactile minimale */
.btn-submit,.btn-secondary,.btn-link,.pg-reset,.lang-btn,.cp-timer-btns button{min-height:44px;}
.radio-group label{min-height:44px;}
/* Godin: stepper */
.stepper{display:flex;align-items:center;gap:6px;}
.stepper button{width:44px;height:44px;border-radius:8px;border:1px solid var(--border);background:var(--cream);font-size:22px;line-height:1;cursor:pointer;color:var(--charcoal);font-family:'DM Sans',sans-serif;}
.stepper button:active{background:var(--gold-light);}
.num-row .stepper input{width:64px;height:44px;padding:0;text-align:center;font-size:16px;}
/* Ordinateur: tableaux */
.sev-table thead th{position:sticky;top:48px;z-index:5;background:var(--section-bg);}
@media(min-width:581px){.sev-table tbody tr:nth-child(even) td{background:#FBF8F1;}}
.sev-table td.cell{padding:0;}
.sev-table td.cell label.cellbtn{display:flex;align-items:center;justify-content:center;width:100%;min-height:44px;cursor:pointer;}
@media(min-width:581px){
  .sev-table tbody td.cell:hover{background:#F7EBC4;}
  .sev-table tbody tr td.cell:has(input:checked){background:var(--gold-light);}
}
/* Mobile */
@media(max-width:580px){
  body{font-size:15px;}
  .field label,.radio-group label,.consent-row span.txt,.sub-q>.q-label,.num-row label,.cp-box p,.cp-protocol,.intro-box,.cp-timer-note,.icr-note{font-size:15px;}
  .section-subtitle{font-size:14px;}
  .hint,.cp-zone{font-size:13.5px;}
  .sev-table,.sev-table tbody{display:block;width:100%;}
  .sev-table thead{display:none;}
  .sev-table tr{display:flex;flex-wrap:wrap;background:var(--section-bg);border-radius:10px;padding:14px 10px 10px;margin-bottom:12px;}
  .sev-table td{display:block;border:none;padding:0;background:transparent;}
  .sev-table td:first-child{width:100%;font-size:15px;font-weight:500;margin-bottom:10px;line-height:1.45;padding:0 4px;}
  .sev-table td.cell{flex:1 0 0;padding:0 2px;text-align:center;}
  .sev-table td.cell label.cellbtn{min-height:52px;}
  .sev-table td.cell input[type=radio]{position:absolute;opacity:0;width:1px;height:1px;}
  .sev-table .num{display:flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:50%;border:1.5px solid var(--border);background:var(--white);font-size:16px;font-weight:500;}
  .sev-table label:has(input:checked) .num{background:var(--gold);border-color:var(--gold);color:var(--charcoal);}
  .sev-table td.m-ends{display:flex;justify-content:space-between;width:100%;font-size:13.5px;color:var(--mid);margin-top:4px;padding:0 4px;}
  .pg-reset{font-size:12px;}
}
</style>
</head>
<body>
<div id="progress-bar">
  <div class="pg-seg" id="pg_resp"><span class="pg-lbl" data-i="p_resp"></span><div class="pg-track"><div class="pg-fill" id="pgf_resp"></div></div></div>
  <div class="pg-seg" id="pg_mouv"><span class="pg-lbl" data-i="p_mouv"></span><div class="pg-track"><div class="pg-fill" id="pgf_mouv"></div></div></div>
  <div class="pg-seg" id="pg_cons"><span class="pg-lbl" data-i="p_cons"></span><div class="pg-track"><div class="pg-fill" id="pgf_cons"></div></div></div>
  <button type="button" class="pg-reset" id="reset-btn-top" data-i="btn_restart"></button>
</div>
<div class="page-wrap">

<header>
  <button type="button" class="lang-btn" id="lang-btn">English</button>
  <svg class="logo-mark" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <circle cx="24" cy="24" r="20" stroke="#C9A84C" stroke-width="1.5" fill="none" opacity=".5"/>
    <path d="M24 8 C10 16 10 32 24 40 C38 32 38 16 24 8Z" stroke="#C9A84C" stroke-width="1.2" fill="none"/>
    <circle cx="24" cy="24" r="3" fill="#C9A84C" opacity=".9"/>
  </svg>
  <h1 data-i="h1"></h1>
  <div class="tagline" data-i="tagline"></div>
  <div class="intro-box" data-i="intro"></div>
</header>

<form id="bilan-form" action="javascript:void(0);" method="POST" novalidate>
<input type="hidden" name="type_formulaire" value="bilan_public">
<input type="hidden" name="langue" id="hidden_langue" value="fr">
<input type="hidden" name="icr_score" id="icr_score" value="">

<!-- 1. SÉCURITÉ -->
<div class="section">
  <div class="section-header">
    <div class="section-num">1</div>
    <div><div class="section-title" data-i="s1_title"></div></div>
  </div>
  <div class="field">
    <label style="display:flex;align-items:flex-start;gap:10px;font-weight:400;cursor:pointer;">
      <input type="checkbox" id="secu_assis" style="margin-top:3px;accent-color:var(--gold);width:16px;height:16px;flex-shrink:0;">
      <span style="font-size:14px;"><span data-i="secu_assis"></span> <span class="req">*</span></span>
    </label>
  </div>
</div>

<!-- 2. ICR -->
<div class="section">
  <div class="section-header">
    <div class="section-num">2</div>
    <div><div class="section-title" data-i="s2_title"></div></div>
  </div>
  <div class="cp-box">
    <p data-i="icr_desc"></p>
    <div class="cp-protocol" data-i="icr_protocol"></div>
    <div class="cp-timer">
      <div class="cp-timer-display" id="icr_display">0.0</div>
      <div class="cp-timer-btns">
        <button type="button" id="icr_start" data-i="btn_start" disabled></button>
        <button type="button" id="icr_stop" class="sec" data-i="btn_stop" disabled></button>
        <button type="button" id="icr_reset" class="sec" data-i="btn_reset"></button>
      </div>
      <div class="cp-timer-note" data-i="icr_note"></div>
      <div class="cp-result" id="icr_result"></div>
      <div class="cp-warn" id="icr_warn"></div>
    </div>
    <div class="cp-scale">
      <div class="cp-zone z-red" id="zone0"><strong data-i="z0_range"></strong><span data-i="z0_label"></span></div>
      <div class="cp-zone z-orange" id="zone1"><strong data-i="z1_range"></strong><span data-i="z1_label"></span></div>
      <div class="cp-zone z-yellow" id="zone2"><strong data-i="z2_range"></strong><span data-i="z2_label"></span></div>
      <div class="cp-zone z-green" id="zone3"><strong data-i="z3_range"></strong><span data-i="z3_label"></span></div>
    </div>
  </div>
</div>

<!-- 3. CONTACT -->
<div class="section">
  <div class="section-header">
    <div class="section-num">3</div>
    <div>
      <div class="section-title" data-i="s3_title"></div>
      <div class="section-subtitle" data-i="s3_sub"></div>
    </div>
  </div>
  <div class="field">
    <label for="prenom"><span data-i="lbl_prenom"></span> <span class="req">*</span></label>
    <input type="text" id="prenom" name="prenom" required autocomplete="given-name" data-ip="ph_prenom">
  </div>
  <div class="field">
    <label for="email"><span data-i="lbl_email"></span> <span class="req">*</span></label>
    <input type="email" id="email" name="email" required autocomplete="email" placeholder="vous@exemple.com">
  </div>
  <label class="consent-row">
    <input type="checkbox" id="consent_resultats" name="consent_resultats">
    <span class="txt"><span data-i="consent_a"></span> <span class="req">*</span></span>
  </label>
  <label class="consent-row">
    <input type="checkbox" id="consent_marketing" name="consent_marketing">
    <span class="txt" data-i="consent_b"></span>
  </label>
  <div class="hint" data-i="policy_line" style="margin-bottom:14px;"></div>
</div>

<!-- 4. RESPIRATION -->
<div class="section">
  <div class="section-header">
    <div class="section-num">4</div>
    <div>
      <div class="section-title" data-i="s4_title"></div>
      <div class="section-subtitle" data-i="s4_sub"></div>
    </div>
  </div>
  <p class="hint" style="margin-bottom:12px;" id="nij_intro"></p>
  <table class="sev-table" id="nij_table">
    <thead><tr id="nij_head"></tr></thead>
    <tbody id="nij_body"></tbody>
  </table>
  <div class="sub-q" style="margin-top:22px;">
    <span class="q-label" data-i="ctx_bouche_q"></span>
    <div class="radio-group">
      <label><input type="radio" name="contexte_bouche_nuit" value="jamais"><span data-i="freq_0"></span></label>
      <label><input type="radio" name="contexte_bouche_nuit" value="parfois"><span data-i="freq_1"></span></label>
      <label><input type="radio" name="contexte_bouche_nuit" value="souvent"><span data-i="freq_2"></span></label>
    </div>
  </div>
  <div class="sub-q">
    <span class="q-label" data-i="ctx_fatigue_q"></span>
    <div class="radio-group">
      <label><input type="radio" name="contexte_fatigue_reveil" value="jamais"><span data-i="freq_0"></span></label>
      <label><input type="radio" name="contexte_fatigue_reveil" value="parfois"><span data-i="freq_1"></span></label>
      <label><input type="radio" name="contexte_fatigue_reveil" value="souvent"><span data-i="freq_2"></span></label>
    </div>
  </div>
</div>

// ---------- Construction des tableaux d'items ----------
function buildScaleTable(headId,bodyId,prefix,count){
  var head=document.getElementById(headId),body=document.getElementById(bodyId);
  var th='<th></th>';
  for(var v=0;v<5;v++){th+='<th><span class="scale-lbl" data-pref="'+prefix+'" data-v="'+v+'"></span><br><small>'+v+'</small></th>';}
  head.innerHTML=th;
  var rows='';
  for(var i=0;i<count;i++){
    rows+='<tr><td><span class="item-txt" data-pref="'+prefix+'" data-idx="'+i+'"></span></td>';
    for(var v2=0;v2<5;v2++){rows+='<td class="cell"><label class="cellbtn"><input type="radio" name="'+prefix+(i+1)+'" value="'+v2+'"><span class="num">'+v2+'</span></label></td>';}
    rows+='<td class="m-ends"><span class="scale-lbl" data-pref="'+prefix+'" data-v="0"></span><span class="scale-lbl" data-pref="'+prefix+'" data-v="4"></span></td></tr>';
  }
  body.innerHTML=rows;
}

// ---------- Chronomètre ICR ----------
var lastICR=null;
function zoneIndex(s){return s<10?0:(s<20?1:(s<=40?2:3));}
function showICR(s){
  var z=zoneIndex(s);
  document.getElementById('icr_warn').textContent=(s<3)?t('icr_short'):((s>60)?t('icr_long'):'');
  document.getElementById('icr_result').textContent=t('icr_result_pre')+s.toFixed(1)+' s · '+t('z'+z+'_label');
  for(var k=0;k<4;k++){document.getElementById('zone'+k).classList.toggle('active',k===z);}
}
(function(){
  var t0=0,iv=null;
  var d=document.getElementById('icr_display'),b1=document.getElementById('icr_start'),b2=document.getElementById('icr_stop'),b3=document.getElementById('icr_reset'),chk=document.getElementById('secu_assis'),hid=document.getElementById('icr_score');
  function tick(){d.textContent=((Date.now()-t0)/1000).toFixed(1);}
  function refresh(){if(!iv)b1.disabled=!chk.checked;}
  chk.addEventListener('change',refresh);
  b1.onclick=function(){
    if(!chk.checked)return;
    t0=Date.now();clearInterval(iv);iv=setInterval(tick,100);
    b1.disabled=true;b2.disabled=false;
    document.getElementById('icr_result').textContent='';
    document.getElementById('icr_warn').textContent='';
    for(var k=0;k<4;k++)document.getElementById('zone'+k).classList.remove('active');
  };
  b2.onclick=function(){
    clearInterval(iv);iv=null;
    var s=Math.round((Date.now()-t0)/100)/10;
    d.textContent=s.toFixed(1);hid.value=s;lastICR=s;
    b2.disabled=true;refresh();showICR(s);
    document.getElementById('bilan-form').dispatchEvent(new Event('change',{bubbles:true}));
  };
  b3.onclick=function(){
    clearInterval(iv);iv=null;d.textContent='0.0';hid.value='';lastICR=null;
    document.getElementById('icr_result').textContent='';
    document.getElementById('icr_warn').textContent='';
    for(var k=0;k<4;k++)document.getElementById('zone'+k).classList.remove('active');
    b2.disabled=true;refresh();
    document.getElementById('bilan-form').dispatchEvent(new Event('change',{bubbles:true}));
  };
})();

// ---------- Calculs ----------
function radioVal(name){var s=document.querySelector('input[name="'+name+'"]:checked');return s?parseInt(s.value):null;}
function normGodin(id){
  var el=document.getElementById(id),v=el.value.trim().replace(',','.');
  if(v==='')return;
  var n=parseFloat(v);
  if(isNaN(n)){el.value='';return;}
  el.value=Math.min(30,Math.max(0,Math.round(n)));
}
function checkedVal(name){var s=document.querySelector('input[name="'+name+'"]:checked');return s?s.value:'';}
function numVal(id){normGodin(id);var v=document.getElementById(id).value;return v===''?null:parseFloat(v);}
['godin_intenses','godin_moderees','godin_legeres'].forEach(function(id){
  var el=document.getElementById(id);
  el.addEventListener('input',function(){
    var c=el.value.replace(/[^0-9.,]/g,'');
    if(/^[0-9]+$/.test(c)&&parseInt(c,10)>30)c='30';
    if(c!==el.value)el.value=c;
  });
  el.addEventListener('blur',function(){normGodin(id);saveState();updateProgress();});
});
document.querySelectorAll('.stepper button').forEach(function(btn){
  btn.addEventListener('click',function(){
    var id=btn.getAttribute('data-target'),el=document.getElementById(id);
    normGodin(id);
    var n=el.value===''?0:parseInt(el.value,10);
    n+=btn.classList.contains('st-plus')?1:-1;
    el.value=Math.min(30,Math.max(0,n));
    el.dispatchEvent(new Event('input',{bubbles:true}));
  });
});

var mqMobile=window.matchMedia('(max-width:580px)');
['nij_body','pss_body'].forEach(function(id){

function compute(){
  var nij=[],nijTotal=0,i;
  for(i=1;i<=16;i++){var v=radioVal('nij'+i);nij.push(v);nijTotal+=v;}
  var pss=[],pssTotal=0;
  for(i=1;i<=4;i++){
    var p=radioVal('pss'+i);
    if(TOOLS.pss.reversed.indexOf(i-1)>-1)p=4-p;
    pss.push(p);pssTotal+=p;
  }
  var icr=parseFloat(document.getElementById('icr_score').value);
  var godin=(numVal('godin_intenses')||0)*9+(numVal('godin_moderees')||0)*5;
  var assis=document.querySelector('input[name="assis"]:checked').value;
  var sitLow=(assis==='moins4'||assis==='4a6'||assis==='6a8');

  var lvResp=(nijTotal>=23||icr<10)?0:((nijTotal<23&&icr>=20)?2:1);
  var lvMouv=(godin<14)?0:((godin>=24&&sitLow)?2:1);
  var lvCons=(pssTotal>=10)?0:((pssTotal<=5)?2:1);

  var portraitList=[];
  document.querySelectorAll('input[name="portrait"]:checked').forEach(function(c){portraitList.push(c.value);});
  var pillarOf={plein_regime:'resp',tendu:'mouv',pilote_auto:'cons'};
  var portraitPillars=[];
  portraitList.forEach(function(v){if(pillarOf[v]&&portraitPillars.indexOf(pillarOf[v])<0)portraitPillars.push(pillarOf[v]);});
  var levels={resp:lvResp,mouv:lvMouv,cons:lvCons};
  var order=['resp','mouv','cons'];
  var min=Math.min(lvResp,lvMouv,lvCons);
  var tied=order.filter(function(k){return levels[k]===min;});
  var priority=tied[0];
  for(var q=0;q<tied.length;q++){if(portraitPillars.indexOf(tied[q])>-1){priority=tied[q];break;}}

  var objectifs=[];
  document.querySelectorAll('input[name="objectif"]:checked').forEach(function(c){objectifs.push(c.value);});

  return {
    prenom:document.getElementById('prenom').value.trim(),
    icr:icr, nijTotal:nijTotal, nij:nij, pssTotal:pssTotal, pss:pss, godin:godin,
    godinInt:numVal('godin_intenses')||0, godinMod:numVal('godin_moderees')||0, godinLeg:numVal('godin_legeres')||0,
    assis:assis, levels:levels, priority:priority, portrait:portraitList.join(', '), portraitList:portraitList, portraitPillars:portraitPillars,
    ctxBouche:checkedVal('contexte_bouche_nuit'), ctxFatigue:checkedVal('contexte_fatigue_reveil'),
    portraitAutre:(portraitList.indexOf('autre')>-1?document.getElementById('portrait_autre').value.trim().slice(0,200):''),
    objectifs:objectifs, sante:document.querySelector('input[name="condition_sante"]:checked').value
  };
}

// ---------- Validation ----------
function validate(){
  var fails=[];
  if(!document.getElementById('secu_assis').checked)fails.push('secu_assis');
  if(document.getElementById('icr_score').value==='')fails.push('icr_display');
  if(!document.getElementById('prenom').value.trim())fails.push('prenom');
  var em=document.getElementById('email').value.trim();
  if(!em||em.indexOf('@')<1||em.indexOf('.',em.indexOf('@'))<0)fails.push('email');
  if(!document.getElementById('consent_resultats').checked)fails.push('consent_resultats');
  var i;
  for(i=1;i<=16;i++){if(radioVal('nij'+i)===null){fails.push('nij_table');break;}}
  if(numVal('godin_intenses')===null)fails.push('godin_intenses');
  else if(numVal('godin_moderees')===null)fails.push('godin_moderees');
  else if(numVal('godin_legeres')===null)fails.push('godin_legeres');
  if(!document.querySelector('input[name="assis"]:checked'))fails.push('assis_group');
  for(i=1;i<=4;i++){if(radioVal('pss'+i)===null){fails.push('pss_body');break;}}
  if(!document.querySelector('input[name="portrait"]:checked'))fails.push('portrait_q');
  if(!document.querySelector('input[name="condition_sante"]:checked'))fails.push('sante_q');
  return fails;
}

  data.portrait=r.portrait;
  data.portrait_autre=r.portraitAutre;
  data.contexte_bouche_nuit=r.ctxBouche;
  data.contexte_fatigue_reveil=r.ctxFatigue;
  data.langue=LANG;
  post(data);

  try{localStorage.removeItem(STORE_KEY);}catch(ex){}
  renderResults(r);
  document.getElementById('bilan-form').style.display='none';
  document.getElementById('results').style.display='block';
  document.getElementById('progress-bar').classList.add('hidden');
  window.scrollTo({top:0,behavior:'smooth'});
});

// ---------- Progression ----------
function answered(names){var n=0;names.forEach(function(nm){if(document.querySelector('input[name="'+nm+'"]:checked'))n++;});return n;}
function updateProgress(){
  var nijNames=[],i;for(i=1;i<=16;i++)nijNames.push('nij'+i);
  var respDone=answered(nijNames)+(document.getElementById('icr_score').value!==''?1:0);
  var respTot=17;
  var movDone=(document.getElementById('godin_intenses').value!==''?1:0)+(document.getElementById('godin_moderees').value!==''?1:0)+(document.getElementById('godin_legeres').value!==''?1:0)+answered(['assis']);
  var movTot=4;
  var consDone=answered(['pss1','pss2','pss3','pss4','portrait','condition_sante']);
  var consTot=6;
  [['resp',respDone,respTot],['mouv',movDone,movTot],['cons',consDone,consTot]].forEach(function(x){
    document.getElementById('pgf_'+x[0]).style.width=Math.round(100*x[1]/x[2])+'%';
    document.getElementById('pg_'+x[0]).classList.toggle('done',x[1]===x[2]);
  });
}

// ---------- Sauvegarde locale ----------
function saveState(){
  var st={f:{},cb:{},icr:document.getElementById('icr_score').value};
  document.querySelectorAll('#bilan-form input').forEach(function(el){
    if(el.type==='hidden')return;
    if(el.type==='radio'){if(el.checked)st.f[el.name]=el.value;}
    else if(el.type==='checkbox'){
      if(el.name==='objectif'||el.name==='portrait'){if(el.checked){(st.cb[el.name]=st.cb[el.name]||[]).push(el.value);}}
      else{st.f[el.id]=el.checked;}
    }
    else if(el.id){st.f[el.id]=el.value;}
  });
  try{localStorage.setItem(STORE_KEY,JSON.stringify(st));}catch(e){}
}
function restoreState(){
  var raw=null;try{raw=localStorage.getItem(STORE_KEY);}catch(e){}
  if(!raw)return;
  var st;try{st=JSON.parse(raw);}catch(e){return;}
  document.querySelectorAll('#bilan-form input').forEach(function(el){
    if(el.type==='hidden')return;
    if(el.type==='radio'){el.checked=(st.f[el.name]===el.value);}
    else if(el.type==='checkbox'){
      if(el.name==='objectif'||el.name==='portrait'){el.checked=!!(st.cb[el.name]&&st.cb[el.name].indexOf(el.value)>-1);}
      else{el.checked=!!st.f[el.id];}
    }
    else if(el.id&&st.f[el.id]!==undefined){el.value=st.f[el.id];}
  });
  if(st.icr!==''&&st.icr!==undefined){
    var s2=parseFloat(st.icr);
    if(!isNaN(s2)){
      document.getElementById('icr_score').value=s2;lastICR=s2;
      document.getElementById('icr_display').textContent=s2.toFixed(1);
      showICR(s2);
    }
  }
  document.getElementById('secu_assis').dispatchEvent(new Event('change'));
}
function doReset(){
  if(!window.confirm(t('confirm_restart')))return;
  try{localStorage.removeItem(STORE_KEY);}catch(e){}
  window.location.reload();
}
['reset-btn','reset-btn-top'].forEach(function(id){document.getElementById(id).addEventListener('click',doReset);});
// Portrait: 3 choix max; "bien" et "un peu de tout" sont exclusifs
document.querySelectorAll('.portrait-cb').forEach(function(cb){
  cb.addEventListener('change',function(){
    var v=cb.value,boxes=document.querySelectorAll('.portrait-cb');
    if(cb.checked&&(v==='bien'||v==='melange')){
      boxes.forEach(function(o){if(o!==cb&&o.value!=='autre')o.checked=false;});
    }else if(cb.checked){
      boxes.forEach(function(o){if(o.value==='bien'||o.value==='melange')o.checked=false;});
    }
    if(document.querySelectorAll('.portrait-cb:checked').length>3){
      cb.checked=false;
      var h=document.getElementById('portrait-hint');
      h.textContent=t('portrait_max');h.style.color='#B3261E';
      setTimeout(function(){h.textContent=t('portrait_hint');h.style.color='';},2200);
    }
  });
});
function updatePortraitOther(){
  var on=!!document.querySelector('input[name="portrait"][value="autre"]:checked');
  document.getElementById('portrait_autre_wrap').style.display=on?'block':'none';
}
document.getElementById('bilan-form').addEventListener('change',function(){updatePortraitOther();saveState();updateProgress();});
document.getElementById('bilan-form').addEventListener('input',function(){saveState();updateProgress();});

applyLang();
restoreState();
updatePortraitOther();
updateProgress();
</script>
</body>
